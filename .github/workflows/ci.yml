name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

# 取消同一 PR/branch 的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git 历史，用于 build info

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            .vite
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-
            ${{ runner.os }}-node-

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run linter (all workspaces)
        run: npm run lint
        continue-on-error: false

      - name: 🧪 Run tests (all workspaces)
        run: npm run test:ci --workspaces --if-present
        continue-on-error: false
        env:
          CI: true

      - name: 📊 Upload frontend test coverage (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-frontend
          path: packages/frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🏗️ Build frontend
        run: npm run build:frontend
        env:
          NODE_ENV: production
          VITE_GITHUB_USERNAME: ${{ vars.VITE_GITHUB_USERNAME }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}
          VITE_DOMAIN: ${{ vars.VITE_DOMAIN }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}

      - name: 📤 Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/frontend/dist/
          retention-days: 7

      - name: 📋 Build summary
        if: success()
        run: |
          echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔖 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⏱️ Node version: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Build Output:**" >> $GITHUB_STEP_SUMMARY
          ls -lh packages/frontend/dist/ >> $GITHUB_STEP_SUMMARY || echo "No dist directory found"

      - name: 🚨 Failure notification
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Step:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for detailed error information." >> $GITHUB_STEP_SUMMARY

  # 检查构建产物大小
  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 📊 Check bundle size
        run: |
          echo "### 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find dist/assets -type f -name "*.js" -exec du -h {} + | sort -rh >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find dist/assets -type f -name "*.css" -exec du -h {} + | sort -rh >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment bundle size on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const totalSize = execSync('du -sh dist/').toString().split('\t')[0];
            const jsFiles = execSync('find dist/assets -type f -name "*.js" -exec du -h {} + | head -3').toString();
            const cssFiles = execSync('find dist/assets -type f -name "*.css" -exec du -h {} +').toString();

            const body = `## 📦 Bundle Size Report

            **Total Size:** \`${totalSize}\`

            ### JavaScript Files (Top 3)
            \`\`\`
            ${jsFiles}
            \`\`\`

            ### CSS Files
            \`\`\`
            ${cssFiles}
            \`\`\`

            ---
            🤖 Generated by CI on commit ${context.sha.substring(0, 7)}
            `;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Bundle Size Report')
            );

            // Update or create comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # SonarCloud 代码质量分析
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 📚 Install dependencies
        run: npm ci

      - name: 📥 Download coverage reports
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          name: coverage-report-frontend
          path: packages/frontend/coverage/
        continue-on-error: true

      - name: 🔎 Debug coverage files
        run: |
          ls -la packages/frontend/coverage || true
          test -f packages/frontend/coverage/lcov.info && echo "lcov.info found" || echo "lcov.info NOT found"

      - name: 🔍 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_GOLDENPATHDEMO }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.javascript.lcov.reportPaths=packages/frontend/coverage/lcov.info

      - name: 📊 Analysis summary
        if: success()
        run: |
          echo "### ✅ SonarCloud Analysis Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Info:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔖 Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 👤 Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results at [SonarCloud Dashboard](https://sonarcloud.io/dashboard?id=${{ vars.SONAR_PROJECT_KEY }})" >> $GITHUB_STEP_SUMMARY

      - name: 🚨 Analysis failure notification
        if: failure()
        run: |
          echo "### ❌ SonarCloud Analysis Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed Step:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for detailed error information." >> $GITHUB_STEP_SUMMARY


