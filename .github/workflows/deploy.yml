name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      actions: read     # ✅ 必须加这一行

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: 🧾 List artifacts from CI run (debug)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "CI run id: $RUN_ID"
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts"
      
      - name: 📥 Download build artifact from CI
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: dist
          path: dist/

      - name: 🔍 Verify dist contents
        run: |
          echo "Dist contents:"
          ls -lh dist
          test -f dist/index.html

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # cloudflare/pages-action 已被 Cloudflare 删除，改用 wrangler（与 deploy-api.yml 一致）
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euxo pipefail
          npx --yes wrangler --version
          npx --yes wrangler pages deploy dist --project-name=golden-path-demo --branch=main

      - name: Health Check
        if: github.event.workflow_run.head_branch == 'main'
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://tiga2000.com/health || echo "Health check failed (expected if domain not configured yet)"
