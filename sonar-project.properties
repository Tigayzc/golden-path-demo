# SonarCloud Configuration
# Organization and project keys are passed via command line arguments in the workflow

# Project metadata
sonar.projectName=Golden Path Demo
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=packages/frontend/src,packages/api/src

# Test file identification
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/test/**

# Coverage settings
sonar.javascript.lcov.reportPaths=packages/frontend/coverage/lcov.info,packages/api/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,**/test/**,**/*.config.*,**/dist/**,**/build/**,**/node_modules/**,**/coverage/**

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.*

# Encoding and SCM
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
